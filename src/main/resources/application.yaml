spring:
  application:
    name: amis-du-bon-bourgogne

  config:
    import: optional:classpath:application-local.yaml
  security:
    user:
      name: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/amis_bourgogne}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Brussels

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

app:
  cors:
    allowed-origins: http://localhost:4200
  login:
    max-failures: 5
    window-minutes: 15

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    org.flywaydb: INFO
