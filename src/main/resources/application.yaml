spring:
  application:
    name: amis-du-bon-bourgogne

  config:
    import: optional:classpath:application-local.yaml
  security:
    user:
      # Compte admin unique (sinon : liste app.admins). Variables d'environnement en production.
      name: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/amis_bourgogne}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Brussels

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Erreurs au format ProblemDetail : le message d'une ResponseStatusException (« Région inconnue : … »)
  # arrive au front dans le champ « detail » ; une erreur interne (500) reste générique.
  mvc:
    problemdetails:
      enabled: true

app:
  cors:
    # Origines autorisées à appeler l'API depuis un autre domaine (développement : ng serve).
    # En production, front et back sont servis à la même adresse : liste vide (voir application-prod.yaml).
    allowed-origins: http://localhost:4200
  login:
    # Protection contre les essais de mots de passe en série
    max-failures: 5
    window-minutes: 15

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    org.flywaydb: INFO
